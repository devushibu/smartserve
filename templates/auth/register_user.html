<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartServe - User Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --dark: #0f172a;
        --gray: #64748b;
        --light: #f8fafc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --error: #ef4444;
        --input-bg: #f1f5f9;
        --glow: rgba(79, 70, 229, 0.2);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Outfit', sans-serif;
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #e0c3fc 0%, #8ec5fc 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .register-container {
        background: var(--surface);
        width: 100%;
        max-width: 500px;
        padding: 45px 40px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        position: relative;
        overflow: hidden;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
        text-align: center;
        margin-bottom: 35px;
    }

    .brand h2 {
        color: var(--dark);
        font-size: 32px;
        font-weight: 700;
        margin: 0 0 10px 0;
        letter-spacing: -0.5px;
    }

    .brand p {
        color: var(--gray);
        font-size: 16px;
        margin: 0;
    }

    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .input-group input {
        width: 100%;
        padding: 16px 16px 16px 48px;
        background: var(--input-bg);
        border: 2px solid transparent;
        border-radius: 14px;
        font-size: 15px;
        color: var(--dark);
        font-family: inherit;
        transition: all 0.3s ease;
    }

    .input-group input:focus {
        outline: none;
        background: var(--surface);
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--glow);
    }
    
    .input-group input::placeholder {
        color: #94a3b8;
    }

    .input-group .icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray);
        font-size: 18px;
        transition: color 0.3s ease;
        pointer-events: none;
    }

    .input-group input:focus + .icon {
        color: var(--primary);
    }

    .btn-register {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary), #6366f1);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(79, 70, 229, 0.35);
        background: linear-gradient(135deg, var(--primary-hover), var(--primary));
    }
    
    .btn-register:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    .auth-links {
        text-align: center;
        margin-top: 25px;
        font-size: 15px;
        color: var(--gray);
    }

    .auth-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
    }

    .auth-links a:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }
    
    .home-link {
        display: inline-block;
        margin-top: 20px;
        color: var(--gray) !important;
        font-weight: 500 !important;
        font-size: 14px;
        transition: color 0.3s ease;
    }
    
    .home-link:hover {
        color: var(--primary) !important;
    }
</style>
</head>
<body>

<div class="register-container">
    <div class="brand">
        <h2>Create Account</h2>
        <p>Join SmartServe to book premium services.</p>
    </div>

    <form method="POST">
        <div class="input-group">
            <input type="text" id="name" name="name" placeholder="Full Name" required autofocus>
            <span class="icon">👤</span>
        </div>

        <div class="input-group">
            <input type="email" id="email" name="email" placeholder="Email Address" required>
            <span class="icon">✉️</span>
        </div>

        <div class="input-group">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span class="icon">🔒</span>
        </div>

        <div class="input-group">
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
            <span class="icon">📱</span>
        </div>

        <div class="input-group">
            <input type="text" id="location" name="location" placeholder="Your Address/Location" required>
            <span class="icon">📍</span>
        </div>

        <button type="submit" class="btn-register">
            Register as Customer <span>&rarr;</span>
        </button>
    </form>

    <div class="auth-links">
        Already have an account? <a href="/login">Sign In</a><br>
        <a href="/" class="home-link">&larr; Back to Home</a>
    </div>
</div>

</body>
</html>
