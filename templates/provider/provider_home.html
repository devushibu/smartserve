<!DOCTYPE html>
<html>
<head>
<title>Provider Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #8b5cf6;
        --secondary: #6366f1;
        --dark: #1e293b;
        --light: #f8fafc;
        --gray: #64748b;
    }
    body { 
        font-family: 'Outfit', sans-serif;
        margin: 0;
        background: radial-gradient(circle at top left, #e0c3fc 0%, #8ec5fc 100%);
        color: var(--dark);
        min-height: 100vh;
    }
    .header-bar {
        background: rgba(255, 255, 255, 0.95);
        padding: 20px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        margin-bottom: 50px;
    }
    h1 { 
        margin: 0; 
        font-size: 26px; 
        font-weight: 700;
        color: var(--primary);
    }
    
    .btn-logout { 
        background: #ef4444; 
        padding: 10px 24px; 
        color: white; 
        text-decoration: none; 
        border-radius: 8px;
        font-weight: 600;
        box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
    }
    
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .dashboard-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 40px;
    }
    
    .big-card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        padding: 45px 30px;
        text-align: center;
        text-decoration: none;
        color: var(--dark);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .icon-wrapper {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
        color: white;
    }
    
    .card-1 .icon-wrapper {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
    }
    
    .card-2 .icon-wrapper {
        background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }

    .big-card h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: var(--dark);
    }
    
    .big-card p {
        color: var(--gray);
        font-size: 16px;
        margin-top: 12px;
        line-height: 1.6;
    }
</style>
</head>

<body>

<div class="header-bar">
    <h1>Provider Dashboard</h1>
    <a href="/login" class="btn-logout">Logout</a>
</div>

<div class="container">
    <div class="dashboard-cards">
        <a href="/provider_assigned" class="big-card card-1">
            <div class="icon-wrapper">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <h2>Assigned Works</h2>
            <p>View and update ongoing and new bookings</p>
        </a>
        
        <a href="/provider_completed" class="big-card card-2">
            <div class="icon-wrapper">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <h2>Completed Works</h2>
            <p>View your past successful jobs</p>
        </a>
    </div>
</div>


</body>
</html>
